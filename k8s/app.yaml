apiVersion: apps/v1
kind: Deployment
metadata:
  name: fragtracker-web
  namespace: esport-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fragtracker-web
  template:
    metadata:
      labels:
        app: fragtracker-web
    spec:
      containers:
      - name: web
        image: yourdockerhub/fragtracker:latest 
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: fragtracker-config
        env:
        - name: Steam__WebHookToken
          valueFrom:
            secretKeyRef:
              name: fragtracker-secrets
              key: Steam__WebHookToken
        - name: ConnectionStrings__DefaultConnection
          value: "Server=sql-db-service;Database=FragTrackerDb;User Id=sa;Password=$(DB_PASSWORD);TrustServerCertificate=True;"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fragtracker-secrets
              key: db-password
---
apiVersion: v1
kind: Service
metadata:
  name: fragtracker-web-service
  namespace: esport-prod
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 31337 # [ПОЧЕРК] Leet port!
  selector:
    app: fragtracker-web
