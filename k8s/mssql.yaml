apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql-db
  namespace: esport-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sql-db
  template:
    metadata:
      labels:
        app: sql-db
    spec:
      containers:
      - name: mssql
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
        - containerPort: 1433
        env:
        - name: ACCEPT_EULA
          value: "Y"
        - name: SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fragtracker-secrets
              key: db-password
---
# Внутрішній Service (ClusterIP) для бази, щоб ніхто із зовні не пробив
apiVersion: v1
kind: Service
metadata:
  name: sql-db-service
  namespace: esport-prod
spec:
  type: ClusterIP
  ports:
  - port: 1433
    targetPort: 1433
  selector:
    app: sql-db
