name: 🚀 FragTracker CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v3

    - name: 🐳 Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: ⚙️ Build and Push Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./FragTracker
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/fragtracker:v${{ github.run_number }}
          ${{ secrets.DOCKER_USERNAME }}/fragtracker:latest

    - name: 📡 Telegram Alert
      if: always()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        format: markdown
        message: |
          🔥 *FragTracker Build Update* 🔥
          ━━━━━━━━━━━━━━━━━━━━━━
          📦 Джерело: `${{ github.repository }}`
          ⚙️ Збірка: `v${{ github.run_number }}`
          🔗 Cтатус: *${{ job.status }}*
          
          _Ready for the next match!_ 🎮
